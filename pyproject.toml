[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cmo-tacview-tiles"
version = "2.1.0"
description = "Download CMO Sentinel-2 Tacview terrain texture tiles by theater or bounding box"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Andyccr", email = "andytaoity@gmail.com"}]
keywords = ["CMO", "Tacview", "textures", "Sentinel-2", "Command Modern Operations"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[project.urls]
Homepage = "https://github.com/Andyccr/CMO-Tacview-texturetiles"
Issues = "https://github.com/Andyccr/CMO-Tacview-texturetiles/issues"

[project.scripts]
cmo-tacview-tiles = "cmo_tacview_tiles.cli:main"

[tool.setuptools.packages.find]
include = ["cmo_tacview_tiles*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["cmo_tacview_tiles"]
branch = true
